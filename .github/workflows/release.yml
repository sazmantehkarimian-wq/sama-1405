name: Sama UAT prerelease
on:
  workflow_dispatch:
  push:
    branches: [clean/sama-next]
    paths: ['VERSION']
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Resolve release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw -Encoding utf8).Trim()
          if ($version -notmatch '^5\.0\.0-uat\.\d+$') { throw "Unexpected UAT VERSION: $version" }
          "SAMA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAMA_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install build dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify immutable authorities
        shell: pwsh
        run: |
          Push-Location "authority/inputs/1405-07-06"
          $lines = Get-Content SHA256SUMS.txt -Encoding utf8
          foreach ($line in $lines) {
            if (-not $line.Trim()) { continue }
            $parts = $line -split '\s+', 2
            $actual = (Get-FileHash $parts[1] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0].ToLowerInvariant()) { throw "Authority SHA mismatch: $($parts[1])" }
          }
          Pop-Location
          python -m import_pipeline.cli verify authority/inputs/1405-07-06
          python -m import_pipeline.cli inspect "authority/inputs/1405-07-06/بسته_به_روزرسانی_سه_اکسل_سما_6مهر.zip"
      - name: Build canonical database from actual workbooks
        shell: pwsh
        run: |
          if (Test-Path data) { Remove-Item data -Recurse -Force }
          python manage.py migrate --noinput
          python -m import_pipeline.cli import "authority/inputs/1405-07-06/بسته_به_روزرسانی_سه_اکسل_سما_6مهر.zip"
          python manage.py collectstatic --noinput
      - name: Regression and deployment checks
        shell: pwsh
        run: |
          pytest -q
          $env:SAMA_HTTPS = '1'
          python manage.py check --deploy
          @'
          import sqlite3
          c=sqlite3.connect('data/sama.sqlite3')
          assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert not c.execute('pragma foreign_key_check').fetchall()
          assert c.execute('select count(*) from properties_motherproperty').fetchone()[0]==225
          assert c.execute("select count(*) from properties_commercialspace where status='ACTIVE'").fetchone()[0]==350
          assert c.execute("select count(*) from properties_commercialspace where status='OUT_OF_CYCLE'").fetchone()[0]==151
          '@ | python -
      - name: Build self-contained Windows package
        shell: pwsh
        run: ./scripts/build_windows_release.ps1 -Version $env:SAMA_VERSION
      - name: Package, extract and smoke-test UAT runtime
        shell: pwsh
        run: |
          $package = "SAMA_$env:SAMA_VERSION"
          New-Item release -ItemType Directory -Force | Out-Null
          Compress-Archive -Path "build/$package" -DestinationPath "release/$package.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "release/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content "release/SHA256SUMS.txt" -Encoding utf8NoBOM
          New-Item verify-package -ItemType Directory | Out-Null
          Expand-Archive "release/$package.zip" verify-package
          $root = "verify-package/$package"
          if (-not (Test-Path "$root/runtime/python.exe")) { throw "Portable runtime missing" }
          if (-not (Test-Path "$root/data/sama.sqlite3")) { throw "Canonical DB missing" }
          if (-not (Test-Path "$root/UAT_BUILD")) { throw "UAT marker missing" }
          $check = ((Get-FileHash "release/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant() + "  $package.zip")
          if ($check -ne (Get-Content "release/SHA256SUMS.txt" -Raw -Encoding utf8).Trim()) { throw "Release hash verification failed" }
          Push-Location $root
          & .\runtime\python.exe scripts\first_start.py
          if ($LASTEXITCODE -ne 0) { throw "Extracted package first-start failed" }
          $env:SAMA_PORT = '8765'
          $server = Start-Process -FilePath ".\runtime\python.exe" -ArgumentList "scripts\run_server.py" -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8765/login/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "Extracted package HTTP smoke test failed" }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: SAMA_${{ env.SAMA_VERSION }}
          path: release/*
      - name: Publish and verify GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $package = "SAMA_$env:SAMA_VERSION"
          gh release view $env:SAMA_TAG *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:SAMA_TAG --prerelease --target "${{ github.sha }}" --title "سما — $env:SAMA_VERSION" --notes "Owner UAT candidate. Windows portable package passed authority, regression, database integrity, extracted-runtime first-start and HTTP smoke gates. Not approved for Production/LAN use; official Golden Master and owner acceptance remain separate gates." }
          gh release upload $env:SAMA_TAG "release/$package.zip" release/SHA256SUMS.txt --clobber
          $releaseJson = gh api "repos/${{ github.repository }}/releases/tags/$env:SAMA_TAG"
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release is not visible through the API" }
          $release = $releaseJson | ConvertFrom-Json
          $assets = @($release.assets | Where-Object { $_.name -ceq "$package.zip" })
          if ($assets.Count -ne 1) { throw "Expected exactly one release asset named $package.zip; found $($assets.Count)" }
          if ([int64]$assets[0].size -le 0) { throw "Published release asset is empty" }
          gh release download $env:SAMA_TAG --pattern "$package.zip" --dir downloaded --clobber
          if ((Get-Item "downloaded/$package.zip").Length -ne [int64]$assets[0].size) { throw "Downloaded release asset size differs from GitHub API metadata" }
          if ((Get-FileHash "downloaded/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne (Get-FileHash "release/$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()) { throw "Published asset hash differs" }
