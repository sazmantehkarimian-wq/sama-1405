name: Build and publish SAMA UAT release

on:
  push:
    branches:
      - release/sama-4.0.0-uat.2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sama-4.0.0-uat.2-release
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-uat.txt

      - name: Install UAT build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-uat.txt

      - name: Verify and reconstruct split inputs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("SPLIT_MANIFEST.json").read_text(encoding="utf-8"))
          for source in manifest["files"]:
              output = Path(source["original_name"])
              if len(source["parts"]) > 1:
                  with output.open("wb") as destination:
                      for item in source["parts"]:
                          part = Path(item["name"])
                          data = part.read_bytes()
                          assert len(data) == item["size"], f"size mismatch: {part}"
                          assert hashlib.sha256(data).hexdigest() == item["sha256"], f"SHA mismatch: {part}"
                          destination.write(data)
              data = output.read_bytes()
              assert len(data) == source["size"], f"reassembled size mismatch: {output}"
              assert hashlib.sha256(data).hexdigest() == source["sha256"], f"reassembled SHA mismatch: {output}"
          PY

      - name: Run authority import unit and integration tests
        env:
          PYTHONPATH: uat
        run: python -m unittest -v uat/test_import_authorities.py

      - name: Build the Windows LAN UAT package from real data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build release-ci
          mkdir -p build/base release-ci
          unzip -q "SAMA_ENTERPRISE_LAN_v3.8.5_LONG_TERM_OVER_365_1405-05-15(1).zip" -d build/base
          package="build/SAMA_4.0.0-uat.2"
          base_package="$(find build/base -type f -name START_SERVER.bat -printf '%h\n' -quit)"
          test -n "${base_package}"
          cp -a "${base_package}" "${package}"
          mkdir -p "${package}/AUTHORITY" "${package}/data/source_authorities" "${package}/QA"
          unzip -q -o SAMA_FINAL_MD_PACK_PRE_UI.zip -d "${package}/AUTHORITY"
          python - <<'PY'
          from pathlib import Path
          import zipfile

          destination = Path("build/SAMA_4.0.0-uat.2/data/source_authorities")
          with zipfile.ZipFile("اکسل نهایی اداره املاک و مستغلات.zip") as archive:
              for member in archive.infolist():
                  if member.filename.lower().endswith(".xlsx"):
                      (destination / Path(member.filename).name).write_bytes(archive.read(member))
          for name in ("اصلی اسامی مدیران مناطق سازمان.xlsx", "نام مراکز (1).xlsx"):
              (destination / name).write_bytes(Path(name).read_bytes())
          PY
          python uat/import_authorities.py \
            --database "${package}/data/database.sqlite3" \
            --report "${package}/QA/IMPORT_REPORT_4.0.0-uat.2.json"
          cp uat/import_authorities.py "${package}/QA/"
          cat > "${package}/CURRENT_VERSION.txt" <<'EOF'
          SAMA Enterprise LAN
          Version: 4.0.0-uat.2
          Release channel: UAT
          Port: 8765
          Authority import: QA/IMPORT_REPORT_4.0.0-uat.2.json
          EOF
          cat > "${package}/VERSION_4.0.0-uat.2.txt" <<'EOF'
          Version: 4.0.0-uat.2
          Status: UAT candidate
          Organization: سازمان فرهنگی هنری شهرداری تهران
          Unit: مدیریت اقتصادی و املاک / اداره املاک و مستغلات
          LAN URL: http://SERVER-IP:8765
          EOF
          cat > "${package}/FIREWALL_8765_FA.txt" <<'EOF'
          netsh advfirewall firewall add rule name="SAMA UAT TCP 8765" dir=in action=allow protocol=TCP localport=8765
          LAN: http://SERVER-IP:8765
          EOF
          python - <<'PY'
          from pathlib import Path

          launcher = Path("build/SAMA_4.0.0-uat.2/START_SERVER.bat")
          text = launcher.read_text(encoding="utf-8-sig")
          text = text.replace("v3.8.5", "v4.0.0-uat.2")
          if "SAMANE_AMLAK_PORT=8765" not in text:
              raise SystemExit("Launcher does not use TCP port 8765")
          launcher.write_text(text, encoding="utf-8-sig", newline="\r\n")
          boot = Path("build/SAMA_4.0.0-uat.2/app/server_boot.py")
          text = boot.read_text(encoding="utf-8").replace("v3.8.5", "4.0.0-uat.2")
          boot.write_text(text, encoding="utf-8")
          PY

      - name: Run release, SQLite, backup/restore, and concurrency gates
        run: python uat/verify_release.py build/SAMA_4.0.0-uat.2

      - name: Package and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("build/SAMA_4.0.0-uat.2")
          manifest = root / "MANIFEST_SHA256_4.0.0-uat.2.txt"
          lines = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path != manifest:
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}")
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          (cd build && zip -q -r -9 ../release-ci/SAMA_4.0.0-uat.2.zip SAMA_4.0.0-uat.2)
          (cd release-ci && sha256sum SAMA_4.0.0-uat.2.zip > SHA256SUMS.txt)
          unzip -t release-ci/SAMA_4.0.0-uat.2.zip
          (cd release-ci && sha256sum --check SHA256SUMS.txt)

      - name: Upload assets to existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v4.0.0-uat.2 --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release upload v4.0.0-uat.2 \
            release-ci/SAMA_4.0.0-uat.2.zip \
            release-ci/SHA256SUMS.txt \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          expected_size="$(stat -c %s release-ci/SAMA_4.0.0-uat.2.zip)"
          actual_size="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v4.0.0-uat.2" \
            --jq '.assets[] | select(.name == "SAMA_4.0.0-uat.2.zip") | .size')"
          test -n "${actual_size}"
          test "${actual_size}" = "${expected_size}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v4.0.0-uat.2" \
            --jq '.assets[] | select(.name == "SHA256SUMS.txt") | .name' | grep -Fx SHA256SUMS.txt
