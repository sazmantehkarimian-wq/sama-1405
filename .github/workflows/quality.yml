name: SAMA Zero-Data quality
on:
  push:
    branches: [work/zero-data-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install -e '.[test]'
      - run: python manage.py migrate --noinput
      - name: Verify zero operational data after migrations
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','sama.settings')
          import django; django.setup()
          from domains.properties.models import (
            MotherProperty, MotherPropertyCorrespondence, MotherPropertyNote,
            MotherPropertyOwnership, MotherPropertyOwnershipDocument,
            MotherPropertyUsageHistory, CommercialSpace,
          )
          from domains.contracts.models import (
            Contract, Beneficiary, ContractCirculation, ContractCustodyTransfer,
            ContractFinalApproval, ContractSignatureStep,
          )
          from domains.operations.models import (
            Appraisal, AppraisalFee, ExpertFeePaymentBatch, ExpertFeeBatchItem,
            Auction, AuctionPeriod, AuctionLot, AuctionParticipant, AuctionProposal,
            UtilityRecord, UtilityConnection, UtilityBill,
            UtilityMeasurement, UtilityUnit, ElectricityBill, ElectricityAllocation,
            ElectricityCalculationSnapshot, FileMovement, TimelineEvent,
          )
          from domains.auctionflow.models import AuctionPeriodProfile, AuctionLotProfile, AuctionDocumentInstance
          checks={
            'mother_properties':MotherProperty.objects.count(),
            'mother_property_ownership':MotherPropertyOwnership.objects.count(),
            'mother_property_ownership_documents':MotherPropertyOwnershipDocument.objects.count(),
            'mother_property_usage':MotherPropertyUsageHistory.objects.count(),
            'mother_property_correspondence':MotherPropertyCorrespondence.objects.count(),
            'mother_property_notes':MotherPropertyNote.objects.count(),
            'commercial_spaces':CommercialSpace.objects.count(),
            'contracts':Contract.objects.count(),
            'beneficiaries':Beneficiary.objects.count(),
            'contract_circulations':ContractCirculation.objects.count(),
            'contract_custody':ContractCustodyTransfer.objects.count(),
            'contract_signatures':ContractSignatureStep.objects.count(),
            'contract_final_approvals':ContractFinalApproval.objects.count(),
            'appraisals':Appraisal.objects.count(),
            'appraisal_fees':AppraisalFee.objects.count(),
            'fee_batches':ExpertFeePaymentBatch.objects.count(),
            'fee_batch_items':ExpertFeeBatchItem.objects.count(),
            'auctions':Auction.objects.count(),
            'auction_periods':AuctionPeriod.objects.count(),
            'auction_lots':AuctionLot.objects.count(),
            'auction_participants':AuctionParticipant.objects.count(),
            'auction_proposals':AuctionProposal.objects.count(),
            'auction_period_profiles':AuctionPeriodProfile.objects.count(),
            'auction_lot_profiles':AuctionLotProfile.objects.count(),
            'auction_generated_documents':AuctionDocumentInstance.objects.count(),
            'utilities':UtilityRecord.objects.count(),
            'utility_connections':UtilityConnection.objects.count(),
            'utility_bills':UtilityBill.objects.count(),
            'utility_units':UtilityUnit.objects.count(),
            'measurements':UtilityMeasurement.objects.count(),
            'electricity_bills':ElectricityBill.objects.count(),
            'electricity_allocations':ElectricityAllocation.objects.count(),
            'electricity_snapshots':ElectricityCalculationSnapshot.objects.count(),
            'movements':FileMovement.objects.count(),
            'timeline':TimelineEvent.objects.count(),
          }
          assert all(v==0 for v in checks.values()), checks
          print(checks)
          PY
      - name: Verify auction-flow schema is migration-clean
        run: python manage.py makemigrations auctionflow --check --dry-run
      - run: pytest -q
      - run: python manage.py check --deploy
        env: {SAMA_HTTPS: '1'}
