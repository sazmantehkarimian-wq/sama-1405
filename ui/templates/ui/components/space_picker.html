<div class="search-picker" data-search-picker><label>فضای تجاری<input type="search" data-picker-query autocomplete="off" placeholder="جست‌وجو با کد، نام یا منطقه" value="{% if space %}{{ space.code }} — {{ space.name }}{% endif %}" aria-controls="space-picker-options"></label><input type="hidden" name="{{ picker_name|default:'space' }}" data-picker-value value="{{ space.code|default:'' }}" required><div class="picker-options" id="space-picker-options" role="listbox" tabindex="-1">{% for item in spaces %}<button type="button" role="option" data-picker-option data-value="{{ item.code }}" data-label="{{ item.code }} — {{ item.name|default:'بدون عنوان' }}" data-search="{{ item.code }} {{ item.name }} {{ item.region.name|default:'' }} {% for assignment in item.beneficiary_assignments.all %}{{ assignment.beneficiary.name }} {% endfor %}" {% if space.code == item.code %}aria-selected="true"{% endif %}>{{ item.code }} — {{ item.name|default:'بدون عنوان' }}{% if item.region %} — {{ item.region.name }}{% endif %}</button>{% endfor %}</div><p class="helper">نتیجه را با کلیدهای جهت‌نما انتخاب کنید.</p></div>
