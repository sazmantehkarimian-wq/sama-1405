{% load static %}<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="application-name" content="سما"><title>ورود | سما</title><link rel="stylesheet" href="{% static 'design_system/css/tokens.css' %}"><link rel="stylesheet" href="{% static 'design_system/css/app.css' %}"></head><body class="login-layout section-contracts"><main class="card login-card"><img class="logo" src="{% static 'design_system/img/organization-logo.png' %}" alt="نشان سازمان فرهنگی هنری شهرداری تهران"><h1>سما</h1><p>ورود کاربران اداره املاک و مستغلات</p>{% if form.non_field_errors %}<div class="notice field-error" role="alert">{% for error in form.non_field_errors %}{{ error }}{% endfor %}</div>{% endif %}<form method="post" novalidate>{% csrf_token %}<label for="id_username">نام کاربری{{ form.username }}{% for error in form.username.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label><label for="id_password">گذرواژه{{ form.password }}{% for error in form.password.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label><button class="emphasized" type="submit">ورود</button></form></main></body></html>
